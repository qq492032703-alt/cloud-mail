name: Reset Admin Password (one-off)

on:
  workflow_dispatch:
    inputs:
      p_hash:
        required: true
        type: string
      p_salt:
        required: true
        type: string

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
    steps:
      - name: Write minimal wrangler config
        run: |
          mkdir -p tmp-reset
          cat > tmp-reset/wrangler.toml <<EOF
          name = "tmp-reset"
          main = "worker.js"
          compatibility_date = "2024-11-01"
          [[d1_databases]]
          binding = "db"
          database_name = "cloud-mail"
          database_id = "$D1_DATABASE_ID"
          EOF
          echo 'export default { fetch() { return new Response("ok") } }' > tmp-reset/worker.js
      - name: Update admin password hash in D1
        run: |
          npx -y wrangler@4 d1 execute cloud-mail --remote -c tmp-reset/wrangler.toml --command "UPDATE user SET password='${{ inputs.p_hash }}', salt='${{ inputs.p_salt }}' WHERE email='admin@skypost.ccwu.cc';"
          npx -y wrangler@4 d1 execute cloud-mail --remote -c tmp-reset/wrangler.toml --command "SELECT user_id, email FROM user WHERE email='admin@skypost.ccwu.cc';"
